name: release

# Pushing a tag like v2.0.0 builds the jar and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/minicad.jar \
            --title "MiniCAD $GITHUB_REF_NAME" \
            --notes "Run it with Java 25 or newer: \`java -jar minicad.jar\`. Without arguments it opens the editor; with a drawing file it runs headless, for example \`java -jar minicad.jar garden.mcad --svg garden.svg\`."
