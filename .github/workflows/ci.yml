name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Check that MiniCAD itself drew the README image
        run: |
          java -jar target/minicad.jar examples/garden.mcad --svg docs/garden.svg
          git diff --exit-code docs/garden.svg
      - uses: actions/upload-artifact@v4
        with:
          name: minicad-jar
          path: target/minicad.jar
